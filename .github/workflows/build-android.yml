name: Build Android APK
# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:
# Lets this workflow create/update GitHub Releases (needed for the
# "Publish APK to a permanent Release" step below).
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install npm dependencies
        run: npm install
      # Pinned to the 6.x line specifically, because @capacitor/core in
      # this project is on version 6 -- the plugin's 7.x/8.x releases
      # require @capacitor/core 7+/8+ and fail to install here otherwise.
      - name: Install Firebase Authentication plugin
        run: npm install @capacitor-firebase/authentication@6
      # Reads www/assets/icons/icon.png and generates every Android launcher
      # icon size/density into android/app/src/main/res/mipmap-* below.
      - name: Install icon generator
        run: npm install @capacitor/assets --save-dev
      # `cap add android` only creates the android/ folder if it doesn't
      # already exist -- safe to run every time, and covers the case
      # where the folder was never committed to the repo. IMPORTANT: the
      # android/ folder must NOT exist in the repo at all (not even
      # partially, e.g. just holding google-services.json) -- if it does,
      # this check skips regenerating it and every later step that
      # expects a full native project (AndroidManifest.xml etc.) fails.
      - name: Ensure native Android project exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      # The Firebase Authentication plugin only bundles Google Sign-In's
      # library (play-services-auth) when this flag is true; otherwise it is
      # compile-only. capacitor.config.json lists "google.com" as a provider,
      # so the plugin builds a Google sign-in client the moment the app
      # starts -- if the library is missing, the app crashes at launch
      # (NoClassDefFoundError). `cap add android` regenerates
      # variables.gradle each build, so the flag is added here every time.
      - name: Bundle Google Sign-In into the Firebase Auth plugin
        run: |
          VARS="android/variables.gradle"
          if ! grep -q "rgcfaIncludeGoogle" "$VARS"; then
            sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' "$VARS"
          fi
      # Replaces Capacitor's default template icon (a generic blue
      # geometric mark, applied fresh by `cap add android` above on every
      # build) with DayNote's actual "D" icon, generated from the single
      # source image at www/assets/icons/icon.png into all the launcher icon
      # sizes/densities Android needs.
      - name: Generate native app icon from www/assets/icons/icon.png
        run: npx capacitor-assets generate --android --assetPath www/assets/icons
      # Builds the launcher icon so it is not cropped. Android draws an app
      # icon from two layers on a 108dp canvas, and each phone shows only the
      # middle part (about 2/3) through its own mask (circle, squircle, ...).
      # The old icon (a maroon square with a thin cream outline) filled that
      # whole visible area, so the outline was cut off on some phones. Here
      # the background is a plain cream layer and the foreground is the
      # maroon "D" square (icon-foreground.png at the repo root, 1024x1024,
      # transparent, artwork kept well inside the safe area), so the mask can
      # only trim plain cream and the outline always shows in full. This
      # overwrites the adaptive-icon files made by the generator above.
      - name: Build adaptive launcher icon (outline stays inside the safe area)
        run: |
          node <<'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const res = 'android/app/src/main/res';
          const sizes = { mdpi: 108, hdpi: 162, xhdpi: 216, xxhdpi: 324, xxxhdpi: 432 };
          (async () => {
            for (const [density, px] of Object.entries(sizes)) {
              const dir = res + '/mipmap-' + density;
              fs.mkdirSync(dir, { recursive: true });
              await sharp('icon-foreground.png').resize(px, px).png().toFile(dir + '/ic_launcher_foreground.png');
            }
            const adaptive = '<?xml version="1.0" encoding="utf-8"?>\n' +
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n' +
              '    <background android:drawable="@color/ic_launcher_background"/>\n' +
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n' +
              '</adaptive-icon>\n';
            fs.mkdirSync(res + '/mipmap-anydpi-v26', { recursive: true });
            fs.writeFileSync(res + '/mipmap-anydpi-v26/ic_launcher.xml', adaptive);
            fs.writeFileSync(res + '/mipmap-anydpi-v26/ic_launcher_round.xml', adaptive);
            fs.mkdirSync(res + '/values', { recursive: true });
            fs.writeFileSync(res + '/values/ic_launcher_background.xml',
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#E4D6CC</color>\n</resources>\n');
            console.log('adaptive launcher icon written');
          })();
          EOF
      # Uses a fixed debug keystore (committed at repo root as
      # daynote-debug.keystore) instead of the default one Gradle would
      # otherwise auto-generate fresh on every run. Without this, the
      # APK's signing certificate -- and therefore its SHA-1 fingerprint
      # -- would be different every build, breaking Google Sign-In (which
      # is registered against one fixed SHA-1 in the Firebase console)
      # after every single rebuild.
      - name: Use our fixed debug keystore (so SHA-1 stays the same every build)
        run: |
          mkdir -p ~/.android
          cp daynote-debug.keystore ~/.android/debug.keystore
      # Copying the keystore to ~/.android was NOT enough on its own: the
      # APK built in CI came out signed with a freshly generated random debug
      # key (different SHA-1 every build), which makes Google Sign-In fail
      # with error 10 (DEVELOPER_ERROR). So the keystore is also wired into
      # Gradle's debug signing config explicitly, by path, in the generated
      # android/app/build.gradle. Path is relative to android/ (rootProject),
      # so ../daynote-debug.keystore is the file at the repo root.
      - name: Tell Gradle to sign debug builds with our keystore
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../daynote-debug.keystore')
                      storeType 'pkcs12'
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
      # Copies the Firebase config (committed at repo root as
      # google-services.json) into the native project. Capacitor's
      # generated app/build.gradle already auto-detects this file and
      # applies the Google Services Gradle plugin itself (see the
      # try/catch block around "servicesJSON" in that file) -- no manual
      # plugin-application step is needed, and one was tried here before
      # but caused a duplicate/conflicting plugin classpath that silently
      # broke Firebase's resource generation, crashing the app at launch.
      - name: Add Firebase config to the native project
        run: cp google-services.json android/app/google-services.json
      # Gives every build a number (the workflow run number: 1, 2, 3, ...).
      #  - www/build-info.json ({"build": N}) is copied into the APK by
      #    `cap sync` below, so the installed app knows its own build number.
      #  - versionCode / versionName in the generated build.gradle are set to
      #    the same number. Android only lets a new APK install OVER an old
      #    one (keeping the data) if its versionCode is not lower, so this
      #    keeps every new build installable as a plain update.
      #  - The Release is named "Build N" (see the last step); the app reads
      #    that name to tell whether a newer build exists.
      # NOTE: do not rename or delete this workflow file. GitHub restarts the
      # run number from 1 for a new workflow file, and Android would then
      # refuse those builds as downgrades.
      - name: Stamp build number into the app
        run: |
          BUILD=${{ github.run_number }}
          echo "{\"build\": $BUILD}" > www/build-info.json
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${BUILD}\"/" android/app/build.gradle
          cat www/build-info.json
          grep -n -E "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode ${BUILD}" android/app/build.gradle
      - name: Sync web assets into the native project
        run: npx cap sync android
      # Declares BOTH exact-alarm permissions, because each one covers a
      # different range of Android versions:
      #   - USE_EXACT_ALARM (Android 13+ / API 33+): auto-granted at
      #     install, no settings toggle for the user to find. Its only
      #     restriction is a Play Store listing policy, which doesn't
      #     apply here since this APK is sideloaded, not published to Play.
      #   - SCHEDULE_EXACT_ALARM (capped to Android 12/12L, API 31-32 via
      #     maxSdkVersion="32"): USE_EXACT_ALARM is ignored on Android 12,
      #     where the local-notifications plugin's canScheduleExactAlarms()
      #     check would otherwise fail and fall back to inexact alarms that
      #     can be minutes late. On Android 12 this permission is granted
      #     by default, so there is still no toggle for the user.
      # `cap add android` regenerates AndroidManifest.xml from scratch each
      # time, so this has to be patched in on every build rather than
      # committed once. The grep check makes this safe to re-run even if
      # the permissions are ever added to a committed manifest later.
      - name: Add exact-alarm permissions to Android manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "USE_EXACT_ALARM" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <application#' "$MANIFEST"
          fi
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      # Safety check: stop here, before uploading or publishing anything, if
      # the APK is not signed with the key registered in Firebase. The
      # SHA-1 it found is printed in the log either way.
      - name: Verify the APK is signed with the registered SHA-1
        run: |
          EXPECTED="25:51:80:35:53:05:78:36:9C:92:79:AB:93:60:66:95:0A:47:A5:F9"
          ACTUAL=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA1:" | head -1 | awk '{print $2}')
          echo "Expected SHA-1: $EXPECTED"
          echo "APK SHA-1:      $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      # Makes the built APK downloadable from the workflow run's summary
      # page (Actions tab -> this run -> Artifacts section), instead of
      # it only existing on the CI runner's disk (which gets thrown away
      # once the job finishes). This copy requires being logged into
      # GitHub and expires after 90 days -- kept here as a quick way to
      # grab a single run's APK, but the Release step below is what the
      # app's own "Install" button should link to.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daynote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Publishes the same APK to a GitHub Release tagged "latest",
      # replacing whatever was there before. This gives a permanent,
      # no-login-required download URL that never changes between
      # builds, which is what makes it safe to hardcode in the app's
      # "Install" button:
      #   https://github.com/<owner>/<repo>/releases/download/latest/app-debug.apk
      - name: Publish APK to a permanent Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build ${{ github.run_number }}
          body: Automatically published from commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
