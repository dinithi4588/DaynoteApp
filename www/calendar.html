<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#7A2E2E" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DayNote" />
<title>DayNote — Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell" id="app-shell">

  <!-- Top bar: hamburger menu, brand, theme icon, profile icon -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="hamburger-btn" aria-label="Open menu">&#9776;</button>
      <a class="brand" href="index.html" aria-label="DayNote home" style="text-decoration:none;color:inherit;">
        <div class="brand-mark">D</div>
        <div class="brand-name font-display">DayNote</div>
      </a>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="theme-btn" aria-label="Change theme" title="Change theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>
        </svg>
      </button>
      <div style="position:relative;">
        <button class="icon-btn" id="profile-btn" aria-label="Profile menu" title="Profile" style="background:var(--calendar-soft);color:var(--calendar);font-weight:700;">
          <span id="profile-initial">U</span>
        </button>
        <div class="popover" id="profile-popover">
          <div class="popover-label">Account</div>
          <button class="popover-item" id="signout-item"><span>&#8618;</span><span>Sign out</span></button>
          <div class="popover-divider"></div>
          <button class="popover-item danger" id="delete-account-item"><span>&#10005;</span><span>Delete account</span></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Nav drawer (hamburger menu) -->
  <div class="scrim" id="scrim"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="brand-mark">D</div>
      <div class="brand-name font-display">DayNote</div>
    </div>
    <div class="drawer-nav" id="drawer-nav"></div>
    <div class="drawer-spacer"></div>
    <div class="drawer-foot">Local data only &middot; backend not yet connected</div>
  </nav>

  <!-- Page content -->
  <div class="page-wrap" id="page-wrap">
    <main class="page" id="page-root">

    </main>
  </div>

  <!-- Bottom tab bar (mobile only) -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <div class="toast-stack" id="toast-stack"></div>
</div>

<!-- ============== Theme picker modal ============== -->
<div class="modal-scrim" id="theme-modal-scrim">
  <div class="modal wide" id="theme-modal">
    <div class="modal-head">
      <h2 class="font-display">Choose a theme</h2>
      <button class="icon-btn" id="theme-modal-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="swatch-grid" id="theme-grid"></div>
  </div>
</div>
<!-- ============== Entry modal: event / task / note (calendar + tasks) ============== -->
<div class="modal-scrim" id="entry-modal-scrim">
  <div class="modal" id="entry-modal">
    <div class="modal-head">
      <h2 class="font-display" id="entry-modal-title">Add to calendar</h2>
      <button class="icon-btn" id="entry-modal-close" aria-label="Close">&#10005;</button>
    </div>
    <form id="entry-form">
      <div class="field hidden" id="entry-type-field">
        <label>Type</label>
        <div class="type-toggle" id="entry-type-toggle"></div>
      </div>
      <div class="field">
        <label for="entry-title">Title</label>
        <input type="text" id="entry-title" placeholder="e.g. Team standup" required maxlength="120" />
      </div>
      <div class="field">
        <label for="entry-notes">Notes</label>
        <textarea id="entry-notes" placeholder="Optional details"></textarea>
      </div>
      <div class="field" id="entry-time-field">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <label for="entry-time">Event time</label>
          <label for="entry-no-time" style="display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-soft);font-weight:500;cursor:pointer;">
            <input type="checkbox" id="entry-no-time" style="width:15px;height:15px;accent-color:var(--calendar);" />
            No time
          </label>
        </div>
        <input type="time" id="entry-time" />
        <div class="field-notime-placeholder hidden" id="entry-time-placeholder">&mdash;&mdash;&mdash;</div>
      </div>

      <div class="field reminder-box" id="entry-reminder-box">
        <div class="reminder-toggle-row">
          <span class="lbl">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Notification
          </span>
          <button type="button" class="switch" id="entry-reminder-switch" aria-label="Toggle reminder"></button>
        </div>
        <div class="reminder-detail" id="entry-reminder-detail">
          <div class="field-row hidden" id="entry-reminder-custom-row">
            <div>
              <label for="entry-reminder-custom-date">Reminder date</label>
              <input type="date" id="entry-reminder-custom-date" />
            </div>
            <div>
              <label for="entry-reminder-custom-time">Reminder time</label>
              <input type="time" id="entry-reminder-custom-time" />
            </div>
          </div>
          <div class="reminder-summary" id="entry-reminder-summary"></div>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn danger hidden" id="entry-delete-btn" style="margin-right:auto;">Delete</button>
        <button type="button" class="btn ghost" id="entry-cancel-btn">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="notifications.js"></script>
<script src="app.js"></script>
<script src="modals.js"></script>
<script src="pages.calendar.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await DB.ready; // wait for IndexedDB to load before reading events/tasks
    UI.init('calendar');
    Pages.calendar.render(document.getElementById('page-root'));
  });
</script>
</body>
</html>
