<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#7A2E2E" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DayNote" />
<title>DayNote — Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell" id="app-shell">

  <!-- Top bar: hamburger menu, brand, theme icon, profile icon -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="hamburger-btn" aria-label="Open menu">&#9776;</button>
      <a class="brand" href="index.html" aria-label="DayNote home" style="text-decoration:none;color:inherit;">
        <div class="brand-mark">D</div>
        <div class="brand-name font-display">DayNote</div>
      </a>
    </div>
    <div class="topbar-right">
      <div style="position:relative;">
        <button class="icon-btn" id="finance-settings-btn" aria-label="Finance settings" title="Finance settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div class="popover" id="finance-settings-popover">
          <div class="popover-label">Finance</div>
          <button type="button" class="popover-item" id="open-report-item"><span>&#128203;</span><span>Monthly report</span></button>
          <button type="button" class="popover-item" id="open-categories-item"><span style="color:var(--finance);display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41 12 22l-9-9V3h10l7.59 9.41a2 2 0 0 1 0 1.18Z"/><circle cx="7.5" cy="7.5" r="1.25" fill="currentColor" stroke="none"/></svg></span><span>Manage categories</span></button>
          <div class="popover-divider"></div>
          <button type="button" class="popover-item danger" id="open-reset-item"><span>&#10005;</span><span>Reset finance data</span></button>
        </div>
      </div>
      <button class="icon-btn" id="theme-btn" aria-label="Change theme" title="Change theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>
        </svg>
      </button>
      <div style="position:relative;">
        <button class="icon-btn" id="profile-btn" aria-label="Profile menu" title="Profile" style="background:var(--calendar-soft);color:var(--calendar);font-weight:700;">
          <span id="profile-initial">U</span>
        </button>
        <div class="popover" id="profile-popover">
          <div class="popover-label">Account</div>
          <button class="popover-item" id="signout-item"><span>&#8618;</span><span>Sign out</span></button>
          <div class="popover-divider"></div>
          <button class="popover-item danger" id="delete-account-item"><span>&#10005;</span><span>Delete account</span></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Nav drawer (hamburger menu) -->
  <div class="scrim" id="scrim"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="brand-mark">D</div>
      <div class="brand-name font-display">DayNote</div>
    </div>
    <div class="drawer-nav" id="drawer-nav"></div>
    <div class="drawer-spacer"></div>
    <div class="drawer-foot">Local data only &middot; backend not yet connected</div>
  </nav>

  <!-- Page content -->
  <div class="page-wrap" id="page-wrap">
    <main class="page" id="page-root">

    </main>
  </div>

  <!-- Bottom tab bar (mobile only) -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <div class="toast-stack" id="toast-stack"></div>
</div>

<!-- ============== Theme picker modal ============== -->
<div class="modal-scrim" id="theme-modal-scrim">
  <div class="modal wide" id="theme-modal">
    <div class="modal-head">
      <h2 class="font-display">Choose a theme</h2>
      <button class="icon-btn" id="theme-modal-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="swatch-grid" id="theme-grid"></div>
  </div>
</div>
<!-- ============== Expense modal (finance) ============== -->
<div class="modal-scrim" id="txn-modal-scrim">
  <div class="modal" id="txn-modal">
    <div class="modal-head">
      <h2 class="font-display" id="txn-modal-title">Add expense</h2>
      <button class="icon-btn" id="txn-modal-close" aria-label="Close">&#10005;</button>
    </div>
    <form id="txn-form">
      <div class="field">
        <label for="txn-amount">Amount (Rs)</label>
        <input type="number" id="txn-amount" min="0" step="0.01" required placeholder="0.00" />
      </div>
      <div class="field" id="txn-category-field">
        <label for="txn-category">Category</label>
        <select id="txn-category"></select>
      </div>
      <div class="field">
        <label for="txn-desc">Description <span style="font-weight:400;color:var(--ink-faint);">(optional)</span></label>
        <textarea id="txn-desc" maxlength="240" rows="2" placeholder="Add a note&hellip;"></textarea>
      </div>
      <div class="field" id="txn-repeat-field">
        <label for="txn-repeat">Repeat</label>
        <select id="txn-repeat">
          <option value="">Doesn't repeat</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
      <div class="btn-row">
        <button type="button" class="btn danger hidden" id="txn-delete-btn" style="margin-right:auto;">Delete</button>
        <button type="button" class="btn ghost" id="txn-cancel-btn">Cancel</button>
        <button type="submit" class="btn" style="background:var(--finance);">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ============== Budget planner modal (finance) ============== -->
<div class="modal-scrim" id="budget-modal-scrim">
  <div class="modal" id="budget-modal">
    <div class="modal-head">
      <h2 class="font-display">Plan your budget</h2>
      <button class="icon-btn" id="budget-modal-close" aria-label="Close">&#10005;</button>
    </div>
    <form id="budget-form">
      <div class="section-title">Budget period</div>
      <div class="field">
        <div class="type-toggle" id="budget-period-toggle" style="--t-color:var(--finance);">
          <button type="button" data-period="month">Month</button>
          <button type="button" data-period="week">Week</button>
          <button type="button" data-period="twoweek">2 Weeks</button>
        </div>
      </div>

      <div class="section-title">Income</div>
      <div class="field">
        <label for="budget-income" class="visually-hidden">Income (Rs)</label>
        <input type="number" id="budget-income" min="0" step="0.01" placeholder="0.00" />
      </div>

      <div class="section-title">Estimated Expenses</div>
      <div class="field field-row">
        <div>
          <label for="budget-food" class="cat-label">Food (Rs)</label>
          <input type="number" id="budget-food" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div>
          <label for="budget-utilities" class="cat-label">Utility &amp; Bills (Rs)</label>
          <input type="number" id="budget-utilities" min="0" step="0.01" placeholder="0.00" />
        </div>
      </div>
      <div class="field field-row">
        <div>
          <label for="budget-transport" class="cat-label">Transport (Rs)</label>
          <input type="number" id="budget-transport" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div>
          <label for="budget-others" class="cat-label">Others (Rs)</label>
          <input type="number" id="budget-others" min="0" step="0.01" placeholder="0.00" />
        </div>
      </div>
      <div class="field">
        <label for="budget-savings" class="cat-label">Savings (Rs)</label>
        <input type="number" id="budget-savings" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div class="btn-row">
        <button type="button" class="btn danger" id="budget-clear-btn" style="margin-right:auto;">Clear</button>
        <button type="button" class="btn ghost" id="budget-cancel-btn">Cancel</button>
        <button type="submit" class="btn" style="background:var(--finance);">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ============== Monthly report modal (finance) ============== -->
<div class="modal-scrim" id="report-modal-scrim">
  <div class="modal wide" id="report-modal">
    <div class="modal-head">
      <h2 class="font-display">Monthly report</h2>
      <button class="icon-btn" id="report-modal-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="report-nav">
      <button class="icon-btn" id="report-prev" aria-label="Previous month">&#8249;</button>
      <div class="report-nav-label" id="report-month-label"></div>
      <button class="icon-btn" id="report-next" aria-label="Next month">&#8250;</button>
    </div>
    <div id="report-body"></div>
    <div class="btn-row">
      <button type="button" class="btn ghost" id="report-close-btn">Close</button>
      <button type="button" class="btn" id="report-pdf-btn" style="background:var(--finance);">&#128196; Download PDF</button>
    </div>
  </div>
</div>

<!-- ============== Manage categories modal (finance) ============== -->
<div class="modal-scrim" id="categories-modal-scrim">
  <div class="modal" id="categories-modal">
    <div class="modal-head">
      <h2 class="font-display">Manage categories</h2>
      <button class="icon-btn" id="categories-modal-close" aria-label="Close">&#10005;</button>
    </div>
    <div id="categories-body"></div>
    <div class="btn-row">
      <button type="button" class="btn ghost" id="categories-close-btn">Close</button>
    </div>
  </div>
</div>

<!-- ============== Reset finance data modal (finance) ============== -->
<div class="modal-scrim" id="reset-modal-scrim">
  <div class="modal" id="reset-modal">
    <div class="modal-head">
      <h2 class="font-display">Reset finance data</h2>
      <button class="icon-btn" id="reset-modal-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="field">
      <label for="reset-scope">What do you want to delete?</label>
      <select id="reset-scope">
        <option value="all">Everything</option>
        <option value="month">A specific month / week</option>
      </select>
    </div>
    <div class="field hidden" id="reset-month-field">
      <label for="reset-month">Month</label>
      <select id="reset-month"></select>
    </div>
    <div class="field hidden" id="reset-week-field">
      <label for="reset-week">Range</label>
      <select id="reset-week"></select>
    </div>
    <div class="btn-row">
      <button type="button" class="btn ghost" id="reset-cancel-btn">Cancel</button>
      <button type="button" class="btn danger" id="reset-confirm-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Capacitor bridge script -- must load before app.js/notifications.js
     so window.Capacitor exists when they run. Without this, the app
     silently behaves like a plain website instead of the native app
     (no native notifications, no Capacitor plugins available). -->
<script src="cordova.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="notifications.js"></script>
<script src="app.js"></script>
<script src="modals.js"></script>
<script src="pages.finance.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await DB.ready; // wait for IndexedDB to load before reading transactions/budget
    UI.init('finance');
    Pages.finance.render(document.getElementById('page-root'));
  });
</script>
</body>
</html>
